apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: opentelemetry-demo-currencyservice
  namespace: argo-rollouts
  labels:
    opentelemetry.io/name: opentelemetry-demo-currencyservice
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: currencyservice
    app.kubernetes.io/name: opentelemetry-demo-currencyservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo

spec:
  replicas: 2
  revisionHistoryLimit: 10

  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-currencyservice

  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-currencyservice
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: currencyservice
        app.kubernetes.io/name: opentelemetry-demo-currencyservice

    spec:
      serviceAccountName: opentelemetry-demo

      containers:
        - name: currencyservice
          image: ghcr.io/open-telemetry/demo:1.12.0-currencyservice
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: service

          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/component']

            - name: OTEL_COLLECTOR_NAME
              value: opentelemetry-demo-otelcol

            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative

            - name: CURRENCY_SERVICE_PORT
              value: "8080"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317

            - name: VERSION
              value: "1.12.0"

            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0

          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 200m
              memory: 20Mi

  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: {}
        - setWeight: 100
