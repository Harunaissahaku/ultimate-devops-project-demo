name: adservice-ci-cd

on:
  push:
    branches:
      - main
    paths:
      - 'src/ad/**'
      - 'pb/**'
      - '.github/workflows/AdserviceCI.yaml'
  workflow_dispatch:

concurrency:
  group: adservice-ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: opentelemetry-adservice

jobs:
  # The ad service is Java/Gradle (JDK 21, targeting Java 17 bytecode).
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run from src/ad; build.gradle resolves protos from the repo-root pb/ dir.
      - name: Build and test
        working-directory: src/ad
        run: ./gradlew build --no-daemon

  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "::error::Set DOCKER_USERNAME and DOCKER_TOKEN in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Dockerfile copies ./pb into ./proto, so the context is src/ad (which has its own pb/).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/ad
          file: src/ad/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  update-k8s:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update Deployment manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
        run: |
          # Anchored on the container's `image:` key so imagePullPolicy is left alone.
          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${IMAGE}|" kubernetes/ad/deploy.yaml
          grep 'image:' kubernetes/ad/deploy.yaml

      - name: Commit and push updated manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/ad/deploy.yaml

          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore: update adservice image to ${IMAGE} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
