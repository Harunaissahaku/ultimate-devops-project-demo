# CI for Product Catalog Service
name: product-catalog-ci

on:
  workflow_dispatch: 

permissions:
  contents: write
  packages: write

jobs:
  # --------------------
  # 1. Build Go service
  # --------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - run: |
          cd src/product-catalog
          go mod download
          go build -o product-catalog-service main.go

      - run: |
          cd src/product-catalog
          go test ./...

  # --------------------
  # 2. Code Quality (Lint)
  # --------------------
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          working-directory: src/product-catalog

  # --------------------
  # 3. Build & Push Docker image (multi-arch)
  # --------------------
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}

  # --------------------
  # 4. Update Kubernetes manifest & push
  # --------------------
  updatek8s:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push
        run: |
          git config user.email "harunaissahaku21@gmail.com"
          git config user.name "issahaku"

          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI]: Update product catalog image tag" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main
