name: frontend-ci-cd

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # --------------------
  # 1. Build frontend Docker image
  # --------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/opentelemetry-frontend:${{ github.run_id }}

  # --------------------
  # 2. Update Kubernetes manifest & push
  # --------------------
  update-k8s:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/opentelemetry-frontend:${{ github.run_id }}|" kubernetes/frontend/deploy.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.email "harunaissahaku21@gmail.com"
          git config user.name "issahaku"
          git add kubernetes/frontend/deploy.yaml
          git commit -m "[CI]: Update frontend image tag" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
