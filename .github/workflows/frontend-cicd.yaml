
name: frontend-ci-cd

env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
push:
paths:
- 'src/frontend/**'
- 'pb/**'
- '.github/workflows/frontend-cicd.yaml'

workflow_dispatch:

permissions:
contents: write
packages: write

jobs:
docker-build:
if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v5
    with:
      fetch-depth: 0

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_TOKEN }}

  - name: Build and push image
    uses: docker/build-push-action@v6
    with:
      context: .
      file: src/frontend/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        ${{ secrets.DOCKER_USERNAME }}/opentelemetry-frontend:${{ github.run_id }}
        ${{ secrets.DOCKER_USERNAME }}/opentelemetry-frontend:latest
      cache-from: type=gha
      cache-to: type=gha,mode=max
```

update-k8s:
runs-on: ubuntu-latest
needs: docker-build

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v5
    with:
      fetch-depth: 0

  - name: Update deployment image
    run: |
      sed -i "s|image: .*opentelemetry-frontend.*|image: ${{ secrets.DOCKER_USERNAME }}/opentelemetry-frontend:${{ github.run_id }}|g" kubernetes/frontend/deploy.yaml

  - name: Configure Git
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

  - name: Commit changes
    run: |
      git add kubernetes/frontend/deploy.yaml
      git diff --cached --quiet || \
      git commit -m "chore: update frontend image to ${{ github.run_id }} [skip ci]"

  - name: Push changes
    run: |
      git pull --rebase origin main
      git push origin HEAD:main
```
