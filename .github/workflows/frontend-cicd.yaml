name: frontend-ci-cd

on:
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'pb/**'
      - '.github/workflows/frontend-cicd.yaml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: opentelemetry-frontend

jobs:
  docker-build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "::error::Set DOCKER_USERNAME and DOCKER_TOKEN in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  update-k8s:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update Deployment manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
        run: |
          sed -i "s|image: .*opentelemetry-frontend.*|image: ${IMAGE}|g" kubernetes/frontend/deploy.yaml
          grep 'image:' kubernetes/frontend/deploy.yaml

      - name: Commit and push updated manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/frontend/deploy.yaml

          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore: update frontend image to ${IMAGE} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
