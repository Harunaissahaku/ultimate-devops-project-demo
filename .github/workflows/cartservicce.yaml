---
name: Cart Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/cart/**'
      - '.github/workflows/cart-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/cart/**'

env:
  DOTNET_VERSION: '8.0.x'
  CART_PATH: 'src/cart'

jobs:

  # ============================================================
  # 1. BUILD AND TEST
  # ============================================================
  build-test:
    name: Build and Test Cart Service
    runs-on: ubuntu-latest

    steps:
#just like git clone you download the source code into the runner
      - name: Checkout source code
        uses: actions/checkout@v4
#this is where you configure the runner to have all the neccesary envrironment to build the application. programming language used here is C#
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: ${{ env.CART_PATH }}
        run: dotnet restore cart.sln

      - name: Build application
        working-directory: ${{ env.CART_PATH }}
        run: dotnet build cart.sln --configuration Release --no-restore

      - name: Run tests
        working-directory: ${{ env.CART_PATH }}
        run: dotnet test cart.sln --configuration Release --no-build

  # ============================================================
  # 2. BUILD DOCKER IMAGE
  # ============================================================
  docker:
    name: Build and Push Docker Image
    needs: build-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/cart
          file: ./src/cart/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:latest

  # ============================================================
  # 3. DEPLOYMENT
  # ============================================================
  deploy:
    name: Update Kubernetes Deployment
    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Update image tag
        run: |
          sed -i "s|image: .*cart-service:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:${{ github.sha }}|" \
          k8s/cart-deployment.yaml

      - name: Commit updated Kubernetes manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/cart-deployment.yaml

          git commit -m "Update cart-service image to ${{ github.sha }}" || echo "No changes"

          git push
```
